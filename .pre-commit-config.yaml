repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: check-yaml
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    - id: pyupgrade
      args: ["--py310-plus"]
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
    - id: black
  - repo: https://github.com/pycqa/isort
    rev: 6.1.0
    hooks:
    - id: isort
      args: ['--filter-files']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
    - id: ruff
      args: [--fix]
  - repo: local
    hooks:
    - id: no-unsandboxed-open
      name: no un-sandboxed open() in sandbox-sensitive modules
      description: >-
        Corpus readers and nltk.data resolve untrusted paths; they must open
        files through the pathsec sandbox (CWE-22/59). Fails on a bare builtin
        open() in the guarded modules (issue #3740).
      entry: python tools/check_no_unsandboxed_open.py
      language: system
      pass_filenames: false
      always_run: true
    - id: all-pickle-through-picklesec
      name: every pickle routes through nltk.picklesec
      description: >-
        Unpickling runs arbitrary code, so a bare pickle.load/loads on
        attacker-controlled bytes is RCE (CWE-502). Fails on any
        pickle.load/loads/dump/dumps/Unpickler/Pickler call outside
        nltk.picklesec itself; load through a picklesec unpickler and write
        through picklesec.pickle_dump / pickle_dumps.
      entry: python tools/check_all_pickle_through_picklesec.py
      language: system
      pass_filenames: false
      always_run: true
    - id: no-bare-execution
      name: no bare eval/exec/compile of a code string
      description: >-
        eval/exec/compile turn a string into running code, so interpolating any
        untrusted fragment is a code-injection primitive (CWE-94/CWE-95). Fails
        on any bare builtin eval/exec/compile that is not annotated with a
        reviewed `# bare-exec ok: <reason>` (the only such use is the fenced
        decorators wrapper eval, CVE-2026-14727).
      entry: python tools/check_no_bare_execution.py
      language: system
      pass_filenames: false
      always_run: true
    - id: no-unsafe-print
      name: no unescaped untrusted print in sandbox-sensitive modules
      description: >-
        Modules that echo externally sourced text (a downloaded index id/name, a
        tweet body, a server error) must neutralise terminal control sequences
        first (CWE-150). Fails on a print() of un-escaped data in the guarded
        modules; route it through nltk.termsec.sanitize_terminal, use !r, or
        annotate a reviewed `# unsafe-print ok: <reason>`.
      entry: python tools/check_no_unsafe_print.py
      language: system
      pass_filenames: false
      always_run: true
