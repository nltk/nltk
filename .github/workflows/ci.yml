name: ci-workflow

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  THIRD_PARTY_DIR: ${{ github.workspace }}/third
  CORENLP: ${{ github.workspace }}/third/stanford-corenlp
  CORENLP_MODELS: ${{ github.workspace }}/third/stanford-corenlp
  STANFORD_PARSER: ${{ github.workspace }}/third/stanford-parser
  STANFORD_MODELS: ${{ github.workspace }}/third/stanford-postagger
  STANFORD_POSTAGGER: ${{ github.workspace }}/third/stanford-postagger
  SENNA: ${{ github.workspace }}/third/senna
  PROVER9: ${{ github.workspace }}/third/prover9/bin
  MEGAM: ${{ github.workspace }}/third/megam
  MALT_PARSER: ${{ github.workspace }}/third/maltparser

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # or your chosen version

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  minimal_download_test:
    name: Minimal NLTK Download Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install core dependencies
        run: pip install regex defusedxml

      - name: Set NLTK_DATA environment variable
        shell: bash
        run: echo "NLTK_DATA=${{ github.workspace }}/nltk_data" >> $GITHUB_ENV

      - name: Show NLTK_DATA in shell
        shell: bash
        run: |
          echo "NLTK_DATA in shell: $NLTK_DATA"

      - name: Ensure minimal NLTK data for cache
        shell: bash
        run: |
          python -c "import os, nltk; d = os.environ['NLTK_DATA']; import pathlib; pathlib.Path(d).mkdir(parents=True, exist_ok=True); nltk.download('wordnet', download_dir=d)"

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [pre-commit, minimal_download_test]
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.14t']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - os: windows-latest
            python-version: '3.14t'  # scikit-learn issue on Py3.14t on Windows
          - os: macos-latest
            python-version: '3.14t'  # free-threaded macOS hosted runner is not
                                      # acquirable (job hangs ~26m then errors:
                                      # "not acquired by Runner of type hosted");
                                      # 3.14t is still covered on ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set NLTK_DATA environment variable
        shell: bash
        run: echo "NLTK_DATA=${{ github.workspace }}/nltk_data" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade --requirement requirements-ci.txt

      - name: Ensure minimal NLTK data for cache
        shell: bash
        run: |
          python -c "import os, nltk; d = os.environ['NLTK_DATA']; import pathlib; pathlib.Path(d).mkdir(parents=True, exist_ok=True); nltk.download('wordnet', download_dir=d)"

      - name: Show NLTK_DATA and workspace
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE is: $GITHUB_WORKSPACE"
          echo "NLTK_DATA is: $NLTK_DATA"
          python -c "import os; print('Python sees GITHUB_WORKSPACE:', os.environ.get('GITHUB_WORKSPACE')); print('Python sees NLTK_DATA:', os.environ.get('NLTK_DATA'))"

      - name: List contents of NLTK data dir
        shell: bash
        run: ls -lR "${{ github.workspace }}/nltk_data" || echo "nltk_data not found"

      - name: Cache nltk data
        uses: actions/cache@v6
        id: nltk-data-cache
        with:
          path: ${{ github.workspace }}/nltk_data
          key: nltk_data_${{ runner.os }}_v2

      - name: Download nltk data on cache miss
        if: steps.nltk-data-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -c "import os; import nltk; from pathlib import Path; path = Path(os.environ['NLTK_DATA']); path.mkdir(parents=True, exist_ok=True); nltk.download('all', download_dir=path)"

      # --- THIRD PARTY TOOLS CACHE SECTION ---
      - name: Ensure third-party directory exists
        run: mkdir -p "${{ env.THIRD_PARTY_DIR }}"

      - name: Cache third-party tools
        uses: actions/cache@v6
        id: third-party-cache
        with:
          path: ${{ env.THIRD_PARTY_DIR }}
          key: third_${{ runner.os }}_${{ hashFiles('tools/github_actions/third-party.sh') }}_v1

      - name: List contents of third-party dir before download
        shell: bash
        run: ls -lR "${{ env.THIRD_PARTY_DIR }}" || echo "third-party dir not found"

      - name: Download third-party data on cache miss
        if: steps.third-party-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x ./tools/github_actions/third-party.sh
          ./tools/github_actions/third-party.sh

      - name: List contents of third-party dir after download/cache
        shell: bash
        run: ls -lR "${{ env.THIRD_PARTY_DIR }}" || echo "third-party dir not found"

      - name: Print NLTK data search paths
        shell: bash
        run: python -c "import nltk; print('NLTK data search paths:', nltk.data.path)"

      - name: Run ReDoS security regression tests
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          # Security regression suite for the ReDoS / catastrophic-backtracking
          # backstop on caller-supplied patterns (GHSA-w3v8-gmh9-3wv7 umbrella:
          # RegexpTokenizer, RegexpTagger, tgrep, chunk rules; plus the shared
          # tight timeout with GHSA-rrv8-h7p8-rx55's Text.findall). Run as its
          # own fast, early step -- with no third-party data needed -- so a
          # change to the main pytest invocation below can never silently drop
          # these checks. The suite is also collected by "Run pytest".
          pytest -rsx nltk/test/unit/test_redos.py

      - name: Run parser/grammar DoS security regression tests
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          # Security regression suite for the unbounded-work parser/grammar DoS
          # cluster (GHSA-ff5c-cp5c-9wjf umbrella: RecursiveDescentParser
          # CVE-2026-12876, ShiftReduceParser, NonprojectiveDependencyParser,
          # ViterbiParser, CFG chomsky_normal_form unit-cycle, generate()). A
          # living audit -- it also asserts the already-bounded parsers
          # (ChartParser, ProjectiveDependencyParser) stay bounded. Own fast,
          # early step so a change to the main pytest invocation cannot silently
          # drop it; also collected by "Run pytest".
          pytest -rsx nltk/test/unit/test_recursivedescent_dos.py nltk/test/unit/test_parser_dos.py nltk/test/unit/test_recursion_dos.py

      - name: Run algorithmic-complexity DoS security regression tests
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          # Security regression suite for the algorithmic-complexity DoS cluster
          # (GHSA-ww6m-cw3f-q94g umbrella: PorterStemmer; GHSA-vp2x XMLCorpusView,
          # GHSA-8mpw TEICorpusView -- all directions -- and read_sexpr_block;
          # plus the repo-wide sweep: TweetTokenizer/RIBES/Syllable/TextTiling/
          # CHILDES single-input sinks and the metrics.distance / aline /
          # gale_church two-string O(n*m) sinks. CWE-407/CWE-400). Own fast,
          # early step so a change to the main pytest invocation can't silently
          # drop it; also collected by "Run pytest".
          pytest -rsx nltk/test/unit/test_quadratic_dos.py nltk/test/unit/test_distance.py

      - name: Run path-traversal / file-I/O security regression tests
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          # Security regression suite for the path-traversal / file-I/O sandbox
          # cluster (GHSA-8mgp-746c-j5xp umbrella: CVE-2026-54293 / GHSA-p4gq and
          # CVE-2026-12243 / GHSA-q5h6 encoded-traversal in nltk.data; GHSA-f794
          # pathsec symlink/hardlink TOCTOU -- read and the newly-closed write
          # side; the perceptron shared-temp squat. CWE-22/59/377). Own fast,
          # early step so a change to the main pytest invocation can't silently
          # drop it; also collected by "Run pytest".
          pytest -rsx nltk/test/unit/test_path_traversal_security.py

      - name: Run advisory-verification probes
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          # One probe per published advisory (nltk/test/unit/security_probes/),
          # each running the attack it describes, plus negative controls that
          # prove the probes flip to VULNERABLE when a guard is removed. Offline;
          # the GitHub coverage check is the separate advisory-coverage job.
          pytest -rsx nltk/test/unit/test_advisory_probes.py

      - name: Run pytest
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          pytest --numprocesses auto -rsx --doctest-modules nltk

  advisory-coverage:
    name: Advisory coverage (GitHub)
    # The only job that pulls the live advisory list, so the only one that hits
    # the network -- the offline probes never do. It runs on every PR (fork
    # ones included), because that is exactly where a missing probe should be
    # caught. Safe to do so: it fetches published advisories UNAUTHENTICATED
    # (they are public), takes an empty `permissions` so even the default
    # GITHUB_TOKEN is neutered, and reads only advisory ids -- there is no
    # secret to exfiltrate and no privilege beyond the test matrix, which
    # already runs the PR's code. It fails only on a real coverage gap and
    # skips if the fetch cannot be made. `permissions: {}` is intentional and
    # sufficient: checking out a public repo needs no token scope.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        # The coverage test only reads probe *keys* and never calls a probe, so
        # it needs the package importable, not the full optional stack.
        run: pip install -e . pytest pytest-mock

      - name: Check every published advisory has a probe
        env:
          NLTK_ADVISORY_CI: "1"
        run: |
          # No token: the public advisories API is read unauthenticated. The
          # test skips if the fetch is unavailable, fails only on a coverage gap.
          pytest -rsx nltk/test/unit/test_advisory_coverage_ci.py
